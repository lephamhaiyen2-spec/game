<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lắp ráp mạch DNA</title><style>body{font-family:Arial,sans-serif;background:#f4f7ff;color:#24324a;margin:0}header{text-align:center;padding:24px;background:white}main{max-width:1000px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 8px 24px #0001}.bases,.strand{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.base,.slot{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:bold}.base{color:white;cursor:pointer}.slot{border:3px dashed #ccd2e2;background:#fafbfe}.A{background:#ed6677}.T{background:#efb33f}.G{background:#48a66b}.C{background:#5b8de8}.btn{border:0;border-radius:12px;padding:12px 18px;background:#6c63ff;color:white;font-weight:bold;cursor:pointer;margin:5px}.info{text-align:center}.error{background:#fff0f3;padding:10px;border-radius:10px;margin:6px}.ok{background:#effff6;padding:14px;border-radius:12px}</style></head><body><header><h1>🧬 LẮP RÁP MẠCH DNA</h1><p>Ghép base theo nguyên tắc bổ sung A–T, G–C</p></header><main><div class="card"><div class="info">🎯 Điểm: <b id="score">0</b> &nbsp; | &nbsp; Đúng: <b id="right">0</b>/<b id="total">12</b></div><h3>Mạch khuôn</h3><div id="template" class="strand"></div><h3>Mạch bổ sung</h3><div id="answer" class="strand"></div><p class="info">Chọn một base màu bên dưới, sau đó chọn ô trống tương ứng.</p><div id="palette" class="bases"><div class="base A" data-b="A">A</div><div class="base T" data-b="T">T</div><div class="base G" data-b="G">G</div><div class="base C" data-b="C">C</div></div><div class="info"><button class="btn" id="new">🔄 Mạch mới</button><button class="btn" id="check">✅ Hoàn thành – Chấm điểm</button></div></div><div id="result" class="card" style="display:none"></div></main><script>const comp={A:'T',T:'A',G:'C',C:'G'},bases=['A','T','G','C'];let seq=[],ans=[],selected='';function newGame(){seq=Array.from({length:12},()=>bases[Math.floor(Math.random()*4)]);ans=Array(12).fill('');selected='';render();document.getElementById('result').style.display='none';document.getElementById('score').textContent=0;document.getElementById('right').textContent=0}function render(){document.getElementById('template').innerHTML=seq.map((b,i)=>'<div class="base '+b+'">'+b+'</div>').join('');document.getElementById('answer').innerHTML=ans.map((b,i)=>'<div class="slot '+(b||'')+'" data-i="'+i+'">'+(b||'?')+'</div>').join('');document.querySelectorAll('.slot').forEach(x=>x.onclick=()=>{if(selected){ans[+x.dataset.i]=selected;selected='';render()}})}document.querySelectorAll('#palette .base').forEach(x=>x.onclick=()=>{selected=x.dataset.b;document.querySelectorAll('#palette .base').forEach(y=>y.style.outline='none');x.style.outline='4px solid #222'});document.getElementById('new').onclick=newGame;document.getElementById('check').onclick=()=>{let right=0,html='';seq.forEach((b,i)=>{if(ans[i]===comp[b])right++;else html+='<div class="error">Vị trí '+(i+1)+': bạn đặt <b>'+(ans[i]||'chưa đặt')+'</b> → đúng là <b>'+comp[b]+'</b>.</div>'});document.getElementById('right').textContent=right;document.getElementById('score').textContent=right*10;const r=document.getElementById('result');r.style.display='block';r.innerHTML=right===seq.length?'<div class="ok">🎉 Xuất sắc! Bạn đã lắp đúng 100% mạch DNA.</div>':'<h3>📊 Kết quả: '+right+'/'+seq.length+' cặp đúng</h3>'+html+'<p><b>Nhớ:</b> A–T và G–C. Hãy sửa các vị trí trên rồi kiểm tra lại!</p>';r.scrollIntoView({behavior:'smooth'})};newGame();</script></body></html>
